name: Verify release assets

on:
  release:
    types: [published, edited]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Select and validate release channel
        id: channel
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "${GITHUB_REPOSITORY}:${RELEASE_TAG}" in
            LindersOSX/TetoTV-Beta:v2.*.*)
              echo "name=Beta" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Only the Beta channel is enabled for publication."
              exit 1
              ;;
          esac
          if [[ ! "${RELEASE_TAG}" =~ ^v[12]\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag is not canonical semantic version syntax."
            exit 1
          fi

      - name: Require release tag at main HEAD
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          main_commit="$(git rev-parse FETCH_HEAD^{commit})"
          if [[ "${tag_commit}" != "${main_commit}" ]]; then
            echo "Release tag ${RELEASE_TAG} must resolve to main HEAD."
            exit 1
          fi

      - name: Enforce public source boundary
        shell: bash
        run: |
          set -euo pipefail
          sdk_path="android/app/libs/discord_partner_sdk.aar"
          if git ls-files --error-unmatch "${sdk_path}" >/dev/null 2>&1; then
            echo "The proprietary Discord Social SDK AAR must not be tracked in public source."
            exit 1
          fi
          if [[ -e "${sdk_path}" ]]; then
            echo "The proprietary Discord Social SDK AAR must not exist in a public checkout."
            exit 1
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Resolve Dart package metadata
        run: flutter pub get

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install APK inspection tools
        shell: bash
        run: sdkmanager "cmdline-tools;latest" "build-tools;36.0.0"

      - name: Download and verify complete release payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          apk_name="TetoTV-${RELEASE_TAG}-universal.apk"
          source_name="TetoTV-${RELEASE_TAG}-native-playback-sources.zip"
          checksums_name="SHA256SUMS"
          expected_title="TetoTV ${version} Beta - Android TV / Google TV / Fire TV"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          if [[ "$(jq -r '.draft' <<<"${release_json}")" != "false" ]]; then
            echo "Completed releases must not be drafts."
            exit 1
          fi
          if [[ "$(jq -r '.prerelease' <<<"${release_json}")" != "false" ]]; then
            echo "Releases must be normal GitHub releases so /releases/latest can find them."
            exit 1
          fi
          if [[ "${RELEASE_TITLE}" != "${expected_title}" ]]; then
            echo "Expected release title '${expected_title}', got '${RELEASE_TITLE}'."
            exit 1
          fi

          mapfile -t actual_assets < <(jq -r '.assets[].name' <<<"${release_json}" | sort)
          mapfile -t expected_assets < <(printf '%s\n' "${apk_name}" "${source_name}" "${checksums_name}" | sort)
          if [[ "${#actual_assets[@]}" -ne 3 ]] || ! diff -u \
              <(printf '%s\n' "${expected_assets[@]}") \
              <(printf '%s\n' "${actual_assets[@]}"); then
            echo "Release must contain exactly the universal APK, native source ZIP, and SHA256SUMS."
            exit 1
          fi
          if jq -e '.assets[] | select(.size <= 0)' <<<"${release_json}" >/dev/null; then
            echo "Release contains an empty asset."
            exit 1
          fi

          download_dir="${RUNNER_TEMP}/tetotv-release"
          mkdir -p "${download_dir}"
          for asset_name in "${apk_name}" "${source_name}" "${checksums_name}"; do
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${asset_name}" \
              --dir "${download_dir}"
            local_digest="$(sha256sum "${download_dir}/${asset_name}" | awk '{print $1}')"
            hosted_digest="$(jq -r --arg name "${asset_name}" '.assets[] | select(.name == $name) | .digest // ""' <<<"${release_json}")"
            if [[ -n "${hosted_digest}" && "sha256:${local_digest}" != "${hosted_digest}" ]]; then
              echo "GitHub asset digest mismatch for ${asset_name}."
              exit 1
            fi
            local_size="$(stat -c '%s' "${download_dir}/${asset_name}")"
            hosted_size="$(jq -r --arg name "${asset_name}" '.assets[] | select(.name == $name) | .size' <<<"${release_json}")"
            if [[ "${local_size}" != "${hosted_size}" ]]; then
              echo "GitHub asset size mismatch for ${asset_name}."
              exit 1
            fi
          done

          jq -r '.body // ""' <<<"${release_json}" > "${download_dir}/RELEASE_NOTES.md"
          mapfile -t review_markers < <(
            grep -Eo '<!--[[:space:]]*tetotv-native-license-review-sha256:[[:space:]]*[0-9a-f]{64}[[:space:]]*-->' \
              "${download_dir}/RELEASE_NOTES.md" || true
          )
          if [[ "${#review_markers[@]}" -ne 1 ]]; then
            echo "Release notes must contain exactly one native-license review digest marker."
            exit 1
          fi
          review_digest="$(sed -E 's/.*:[[:space:]]*([0-9a-f]{64})[[:space:]]*-->.*/\1/' <<<"${review_markers[0]}")"
          all_review_marker_count="$(grep -Eic '<!--[[:space:]]*tetotv-native-license-review-sha256:' "${download_dir}/RELEASE_NOTES.md" || true)"
          if [[ "${all_review_marker_count}" -ne 1 ]]; then
            echo "Release notes contain an unexpected native-license review marker."
            exit 1
          fi

          mapfile -t attestation_markers < <(
            grep -Eo '<!--[[:space:]]*tetotv-native-license-review-attestation-base64:[[:space:]]*[A-Za-z0-9+/]+={0,2}[[:space:]]*-->' \
              "${download_dir}/RELEASE_NOTES.md" || true
          )
          if [[ "${#attestation_markers[@]}" -ne 1 ]] || \
             [[ "$(grep -Eic '<!--[[:space:]]*tetotv-native-license-review-attestation-base64:' "${download_dir}/RELEASE_NOTES.md" || true)" -ne 1 ]]; then
            echo "Release notes must contain exactly one encoded native-license review attestation."
            exit 1
          fi
          mapfile -t signature_markers < <(
            grep -Eo '<!--[[:space:]]*tetotv-native-license-review-signature-base64:[[:space:]]*[A-Za-z0-9+/]+={0,2}[[:space:]]*-->' \
              "${download_dir}/RELEASE_NOTES.md" || true
          )
          if [[ "${#signature_markers[@]}" -ne 1 ]] || \
             [[ "$(grep -Eic '<!--[[:space:]]*tetotv-native-license-review-signature-base64:' "${download_dir}/RELEASE_NOTES.md" || true)" -ne 1 ]]; then
            echo "Release notes must contain exactly one encoded native-license review signature."
            exit 1
          fi

          attestation_base64="$(sed -E 's|.*:[[:space:]]*([A-Za-z0-9+/]+={0,2})[[:space:]]*-->.*|\1|' <<<"${attestation_markers[0]}")"
          signature_base64="$(sed -E 's|.*:[[:space:]]*([A-Za-z0-9+/]+={0,2})[[:space:]]*-->.*|\1|' <<<"${signature_markers[0]}")"
          if ! printf '%s' "${attestation_base64}" | base64 --decode > "${download_dir}/native-license-review.json" || \
             ! printf '%s' "${signature_base64}" | base64 --decode > "${download_dir}/native-license-review.json.sig"; then
            echo "Release notes contain invalid encoded native-license review evidence."
            exit 1
          fi
          if [[ "$(sha256sum "${download_dir}/native-license-review.json" | awk '{print $1}')" != "${review_digest}" ]]; then
            echo "Encoded native-license review attestation does not match its digest marker."
            exit 1
          fi

          reviewer_allowlist="tool/release/qualified_native_license_reviewers.allowed_signers"
          if ! grep -Eq '^[^#[:space:]][^[:space:]]*[[:space:]]+.*ssh-(ed25519|rsa)[[:space:]]+' "${reviewer_allowlist}"; then
            echo "No qualified native-license reviewer key is active in the release revision."
            exit 1
          fi

          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          pwsh -File ./tool/release/verify_native_license_review.ps1 \
            -AttestationPath "${download_dir}/native-license-review.json" \
            -SignaturePath "${download_dir}/native-license-review.json.sig" \
            -ReleaseTag "${RELEASE_TAG}" \
            -GitCommit "${tag_commit}" \
            -ApkPath "${download_dir}/${apk_name}" \
            -NativeSourcePath "${download_dir}/${source_name}"

          artifact_dir="${RUNNER_TEMP}/tetotv-pinned-native-artifacts"
          mkdir -p "${artifact_dir}"
          while IFS=$'\t' read -r artifact_name artifact_url artifact_size artifact_sha256; do
            if [[ ! "${artifact_name}" =~ ^[A-Za-z0-9._-]+$ ]] || \
               [[ ! "${artifact_url}" =~ ^https:// ]] || \
               [[ ! "${artifact_size}" =~ ^[1-9][0-9]*$ ]] || \
               [[ ! "${artifact_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid pinned native artifact metadata."
              exit 1
            fi
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
              --retry 3 --output "${artifact_dir}/${artifact_name}" "${artifact_url}"
            if [[ "$(stat -c '%s' "${artifact_dir}/${artifact_name}")" != "${artifact_size}" ]]; then
              echo "Pinned native artifact size mismatch: ${artifact_name}."
              exit 1
            fi
            printf '%s  %s\n' "${artifact_sha256}" "${artifact_dir}/${artifact_name}" | sha256sum --check --strict
          done < <(
            jq -r '.binaryArtifacts[] | [.fileName, .url, (.size | tostring), .sha256] | @tsv' \
              tool/release/native_playback_manifest.json
          )
          if [[ "$(find "${artifact_dir}" -maxdepth 1 -type f | wc -l)" -ne 5 ]]; then
            echo "Exactly five pinned native binary artifacts are required."
            exit 1
          fi

          pwsh -File ./tool/release/verify_release_payloads.ps1 \
            -Channel "${CHANNEL}" \
            -ApkPath "${download_dir}/${apk_name}" \
            -NativeSourcePath "${download_dir}/${source_name}" \
            -ChecksumsPath "${download_dir}/${checksums_name}" \
            -ReleaseNotesPath "${download_dir}/RELEASE_NOTES.md" \
            -ResolvedBinaryDirectory "${artifact_dir}" \
            -NativeLicenseReviewSha256 "${review_digest}"

          jq -n \
            --arg releaseTag "${RELEASE_TAG}" \
            --arg gitCommit "${tag_commit}" \
            --arg nativeLicenseReviewSha256 "${review_digest}" \
            '{
              schemaVersion: 1,
              verificationType: "tetotv-release-payload-verification",
              releaseTag: $releaseTag,
              gitCommit: $gitCommit,
              nativeLicenseReviewSha256: $nativeLicenseReviewSha256,
              checksPerformed: [
                "allowlisted-reviewer-ssh-signature",
                "artifact-bound-native-license-review",
                "hosted-asset-digests-and-sizes",
                "apk-signature-abi-and-alignment",
                "native-source-and-notice-bundle",
                "pinned-native-binary-inputs"
              ]
            }' > "${download_dir}/release-verification-predicate.json"

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "${latest_tag}" != "${RELEASE_TAG}" ]]; then
            echo "${RELEASE_TAG} is not exposed through /releases/latest."
            exit 1
          fi

      - name: Attest the independently verified release payload
        id: release-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ runner.temp }}/tetotv-release/TetoTV-${{ github.event.release.tag_name }}-universal.apk
            ${{ runner.temp }}/tetotv-release/TetoTV-${{ github.event.release.tag_name }}-native-playback-sources.zip
            ${{ runner.temp }}/tetotv-release/SHA256SUMS
          predicate-type: https://github.com/LindersOSX/TetoTV-Beta/attestations/release-verification/v1
          predicate-path: ${{ runner.temp }}/tetotv-release/release-verification-predicate.json

      - name: Verify the emitted release attestation bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ATTESTATION_BUNDLE: ${{ steps.release-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          verified_release=false
          for attempt in 1 2 3 4 5; do
            if gh release verify "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"; then
              verified_release=true
              break
            fi
            if [[ "${attempt}" -lt 5 ]]; then sleep 5; fi
          done
          if [[ "${verified_release}" != "true" ]]; then
            echo "GitHub did not provide a valid immutable-release attestation."
            exit 1
          fi
          for artifact in \
            "${RUNNER_TEMP}/tetotv-release/TetoTV-${RELEASE_TAG}-universal.apk" \
            "${RUNNER_TEMP}/tetotv-release/TetoTV-${RELEASE_TAG}-native-playback-sources.zip" \
            "${RUNNER_TEMP}/tetotv-release/SHA256SUMS"; do
            gh attestation verify "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" \
              --bundle "${ATTESTATION_BUNDLE}" \
              --predicate-type "https://github.com/LindersOSX/TetoTV-Beta/attestations/release-verification/v1" \
              --signer-workflow "LindersOSX/TetoTV-Beta/.github/workflows/verify-release-assets.yml" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --deny-self-hosted-runners
          done
