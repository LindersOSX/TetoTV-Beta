name: Source policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    name: Source policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Flutter SDK commit
        env:
          FLUTTER_COMMIT: 058e0af2c2b57e369d905a03ac9748b0ebf543c6 # 3.44.8 stable
          FLUTTER_TAG: 3.44.8
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin "refs/tags/$FLUTTER_TAG:refs/tags/$FLUTTER_TAG"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse "refs/tags/$FLUTTER_TAG^{commit}")" = "$FLUTTER_COMMIT"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos

      - name: Verify repository and release policy
        run: >-
          flutter test
          test/release_repository_policy_test.dart
          test/native_redistribution_materials_test.dart
          test/privacy_screen_test.dart

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
